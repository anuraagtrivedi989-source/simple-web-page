<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main>
        <nav>
            <div class="left">Kanban</div>
            <div class="right"><button id="toggle-modal">Add New Task</button>
            </div>
        </nav>
        <section class="board">
            <div id="todo" class="task-column">
                <div class="heading">
                    <div class="left">ToDo</div>
                    <div class="right">Count</div>
                </div>
                <!-- <div draggable="true" class="task">
                    <h2>Task</h2>
                    <p>Decription for task</p>
                    <button>Delete</button>
                </div> -->
            </div>
            <div id="progress" class="task-column ">
                <div class="heading">
                    <div class="left">InProgress</div>
                    <div class="right">Count</div>
                </div>
            </div>
            <div id="done" class="task-column">
                <div class="heading">
                    <div class="left">Done</div>
                    <div class="right">Count</div>
                </div>
            </div>
        </section>
    </main>
    <div class="modal add-new-task">
        <div class="bg"></div>
        <div class="center">
            <input id="task-title" type="text" placeholder="Enter the task">
            <textarea id="task-description" placeholder="description" ></textarea>
            <button id="add-new-task" class="add-task-btn">AddTask</button>
        </div>

    </div>
    <script src="script.js"></script>
</body>

</html>
